<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Post</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1080px;
        color: #dff0ec;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          "Helvetica Neue",
          "Liberation Sans",
          "DejaVu Sans",
          Arial,
          sans-serif;
        background:
          radial-gradient(
            80% 70% at 50% -10%,
            color-mix(in srgb, #3ec8b0 22%, transparent) 0%,
            transparent 58%
          ),
          linear-gradient(165deg, #081d1a 0%, #0c2c26 100%);
      }

      .post::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 50%,
          rgba(0, 0, 0, 0.38) 100%
        );
      }

      .post__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 104px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .post__kicker {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        max-width: 880px;
        height: 50px;
        padding: 0 26px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, #3ec8b0 32%, transparent);
        color: #3ec8b0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .post__main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .post__headline {
        max-width: 920px;
        font-size: 88px;
        line-height: 1.04;
        font-weight: 850;
        letter-spacing: -0.026em;
      }

      .post__headline em {
        color: #3ec8b0;
        font-style: normal;
      }

      .post__headline::after {
        content: "";
        display: block;
        width: 132px;
        height: 8px;
        margin-top: 44px;
        border-radius: 999px;
        background: #3ec8b0;
      }

      .post__insight {
        max-width: 760px;
        font-size: 32px;
        line-height: 1.4;
        font-weight: 400;
        color: color-mix(in srgb, #dff0ec 80%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="post__inner">
        <span class="post__kicker">Sichtbarkeit &amp; Vertrauen</span>
        <div class="post__main">
          <h1 class="post__headline">
            Die meisten kaufen nicht beim Besten, sondern bei dem, den sie
            <em>kennen</em>
          </h1>
        </div>
        <p class="post__insight">
          Mein erster großer Auftrag kam nicht vom lautesten Beitrag — sondern
          von jemandem, der mich monatelang still mitgelesen hatte und im
          richtigen Moment wusste, wen er fragt.
        </p>
      </div>
    </div>
  </body>
</html>
