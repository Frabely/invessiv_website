<!doctype html>
<html lang="[LOCALE]">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Post</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1080px;
        color: [TEXT];
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          "Helvetica Neue",
          "Liberation Sans",
          "DejaVu Sans",
          Arial,
          sans-serif;
        background:
          radial-gradient(
            60% 50% at 12% 8%,
            color-mix(in srgb, [ACCENT] 22%, transparent) 0%,
            transparent 56%
          ),
          radial-gradient(
            60% 55% at 95% 100%,
            color-mix(in srgb, [ACCENT] 14%, transparent) 0%,
            transparent 58%
          ),
          linear-gradient(140deg, [BG_START] 0%, [BG_END] 100%);
      }

      .post::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 58%,
          rgba(0, 0, 0, 0.3) 100%
        );
      }

      .post__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 104px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .post__expertise {
        display: block;
        max-width: 880px;
        margin-bottom: 34px;
        color: [ACCENT];
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .post__headline {
        max-width: 860px;
        margin-bottom: 62px;
        font-size: 60px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.016em;
      }

      .post__headline em {
        color: [ACCENT];
        font-style: normal;
      }

      .post__bullets {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .post__bullets li {
        position: relative;
        padding: 26px 32px 26px 78px;
        border-radius: 20px;
        border: 1px solid color-mix(in srgb, [TEXT] 8%, transparent);
        border-left: 5px solid [ACCENT];
        background: color-mix(in srgb, [TEXT] 5%, transparent);
        font-size: 30px;
        line-height: 1.28;
        font-weight: 500;
        color: color-mix(in srgb, [TEXT] 92%, transparent);
      }

      .post__bullets li::before {
        content: "";
        position: absolute;
        left: 34px;
        top: 36px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: [ACCENT];
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="post__inner">
        <span class="post__expertise">[EXPERTISE]</span>
        <h1 class="post__headline">[HEADLINE]</h1>
        [BODY_CONTENT]
      </div>
    </div>
  </body>
</html>
