<!doctype html>
<html lang="[LOCALE]">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Post</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1080px;
        color: [TEXT];
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          "Helvetica Neue",
          "Liberation Sans",
          "DejaVu Sans",
          Arial,
          sans-serif;
        background:
          radial-gradient(
            62% 50% at 16% 12%,
            color-mix(in srgb, [ACCENT] 26%, transparent) 0%,
            transparent 60%
          ),
          radial-gradient(
            54% 48% at 88% 92%,
            color-mix(in srgb, [ACCENT] 14%, transparent) 0%,
            transparent 58%
          ),
          linear-gradient(150deg, [BG_START] 0%, [BG_END] 100%);
      }

      /* vignette for depth */
      .post::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at center,
          transparent 56%,
          rgba(0, 0, 0, 0.34) 100%
        );
      }

      .post__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 96px 92px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .post__card {
        position: relative;
        padding: 84px 76px;
        border-radius: 40px;
        border: 1px solid color-mix(in srgb, [TEXT] 9%, transparent);
        background: linear-gradient(
          180deg,
          color-mix(in srgb, [TEXT] 6%, transparent),
          color-mix(in srgb, [TEXT] 2%, transparent)
        );
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, [TEXT] 8%, transparent),
          0 28px 60px rgba(0, 0, 0, 0.28);
        text-align: center;
      }

      .post__divider {
        position: relative;
        height: 1px;
        margin: 6px 0 64px;
        background: color-mix(in srgb, [TEXT] 16%, transparent);
      }

      .post__kicker {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translate(-50%, -50%);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        max-width: 760px;
        height: 52px;
        padding: 0 30px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, [ACCENT] 34%, transparent);
        background: [BG_END];
        color: [ACCENT];
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .post__headline {
        margin: 0 auto;
        max-width: 800px;
        font-size: 64px;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.015em;
      }

      .post__headline em {
        color: [ACCENT];
        font-style: normal;
      }

      .post__insight {
        margin: 52px auto 0;
        max-width: 720px;
        font-size: 31px;
        line-height: 1.4;
        font-weight: 400;
        color: color-mix(in srgb, [TEXT] 82%, transparent);
      }

      .post__highlight {
        display: inline-block;
        margin-top: 56px;
        max-width: 780px;
        padding: 22px 42px;
        border-radius: 22px;
        border: 1px solid color-mix(in srgb, [ACCENT] 26%, transparent);
        background: color-mix(in srgb, [ACCENT] 13%, transparent);
        color: [TEXT];
        font-size: 29px;
        font-weight: 750;
        line-height: 1.22;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="post__inner">
        <div class="post__card">
          <div class="post__divider">
            <span class="post__kicker">[KICKER]</span>
          </div>
          <h1 class="post__headline">[HEADLINE]</h1>
          [BODY_CONTENT] [HIGHLIGHT_BLOCK]
        </div>
      </div>
    </div>
  </body>
</html>
