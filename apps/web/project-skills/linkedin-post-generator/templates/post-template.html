<!doctype html>
<html lang="[LOCALE]">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Post</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      .post {
        width: 1080px;
        height: 1080px;
        background: linear-gradient(135deg, [BG_START] 0%, [BG_END] 100%);
        position: relative;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          "Helvetica Neue",
          "Liberation Sans",
          "DejaVu Sans",
          Arial,
          sans-serif;
        color: [TEXT];
        display: flex;
        flex-direction: column;
      }

      .post__deco {
        position: absolute;
        top: -80px;
        right: -80px;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: [ACCENT];
        opacity: 0.07;
        pointer-events: none;
      }

      .post__deco-2 {
        position: absolute;
        bottom: -60px;
        left: -60px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: [ACCENT];
        opacity: 0.05;
        pointer-events: none;
      }

      .post__inner {
        position: relative;
        z-index: 1;
        padding: 92px 88px 88px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .post__expertise {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: [ACCENT];
        max-width: 880px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 28px;
      }

      .post__rule {
        width: 56px;
        height: 3px;
        background: [ACCENT];
        border-radius: 2px;
        margin-bottom: 36px;
        opacity: 0.85;
      }

      .post__headline {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.015em;
        color: [TEXT];
        max-width: 860px;
        margin-bottom: 40px;
      }

      .post__headline em {
        color: [ACCENT];
        font-style: normal;
      }

      .post__body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      .post__insight {
        font-size: 30px;
        font-weight: 400;
        line-height: 1.42;
        color: [TEXT];
        opacity: 0.82;
        max-width: 820px;
      }

      .post__bullets {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 840px;
      }

      .post__bullets li {
        font-size: 28px;
        font-weight: 400;
        line-height: 1.32;
        color: [TEXT];
        opacity: 0.86;
        padding-left: 28px;
        position: relative;
      }

      .post__bullets li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: [ACCENT];
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="post__deco"></div>
      <div class="post__deco-2"></div>
      <div class="post__inner">
        <span class="post__expertise">[EXPERTISE]</span>
        <div class="post__rule"></div>
        <h1 class="post__headline">[HEADLINE]</h1>

        <div class="post__body">[BODY_CONTENT]</div>
      </div>
    </div>
  </body>
</html>
