<!doctype html>
<html lang="[LOCALE]">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Post</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1080px;
        color: [TEXT];
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          "Helvetica Neue",
          "Liberation Sans",
          "DejaVu Sans",
          Arial,
          sans-serif;
        background:
          radial-gradient(
            70% 60% at 100% 0%,
            color-mix(in srgb, [ACCENT] 24%, transparent) 0%,
            transparent 56%
          ),
          radial-gradient(
            48% 44% at 6% 96%,
            color-mix(in srgb, [ACCENT] 12%, transparent) 0%,
            transparent 60%
          ),
          linear-gradient(125deg, [BG_START] 0%, [BG_END] 100%);
      }

      .post::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 30% 50%,
          transparent 62%,
          rgba(0, 0, 0, 0.3) 100%
        );
      }

      .post__inner {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 110px 104px 110px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* accent rail */
      .post__inner::before {
        content: "";
        position: absolute;
        left: 96px;
        top: 130px;
        bottom: 130px;
        width: 8px;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          [ACCENT],
          color-mix(in srgb, [ACCENT] 30%, transparent)
        );
      }

      .post__content {
        padding-left: 56px;
      }

      .post__kicker {
        display: block;
        max-width: 820px;
        margin-bottom: 40px;
        color: [ACCENT];
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .post__headline {
        max-width: 840px;
        font-size: 66px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -0.018em;
      }

      .post__headline em {
        color: [ACCENT];
        font-style: normal;
      }

      .post__insight {
        margin-top: 48px;
        max-width: 760px;
        font-size: 32px;
        line-height: 1.42;
        font-weight: 400;
        color: color-mix(in srgb, [TEXT] 82%, transparent);
      }

      .post__highlight {
        display: inline-block;
        margin-top: 52px;
        max-width: 800px;
        padding: 20px 38px;
        border-radius: 18px;
        border-left: 4px solid [ACCENT];
        background: color-mix(in srgb, [ACCENT] 12%, transparent);
        color: [TEXT];
        font-size: 28px;
        font-weight: 750;
        line-height: 1.24;
      }
    </style>
  </head>
  <body>
    <div class="post">
      <div class="post__inner">
        <div class="post__content">
          <span class="post__kicker">[KICKER]</span>
          <h1 class="post__headline">[HEADLINE]</h1>
          [BODY_CONTENT] [HIGHLIGHT_BLOCK]
        </div>
      </div>
    </div>
  </body>
</html>
