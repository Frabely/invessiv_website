display_name: Invessiv Outreach Skill
short_description: Create cautious, individualized LinkedIn first messages with a strict Subject/Message output contract, website-aware framing, up to two concrete hints, and a neutral subject line.
default_prompt: >-
  Nutze den Invessiv Outreach Skill.

  Erstelle eine individuelle Erstnachricht für Invessiv mit neutralem Betreff.
  Wichtige Regeln:
  - Kein harter Pitch.
  - Erst um Erlaubnis fragen.
  - Wenn eine Website vorhanden ist, darauf konkret Bezug nehmen und maximal zwei passende Hinweise verwenden.
  - Wenn keine Website vorhanden ist, keine Website-Analyse vortäuschen und eher generisch-individuell schreiben.
  - In diesem Fall Pilotprojekte zu fairen Einstiegskonditionen erwähnen.
  - Die Ausgabe muss exakt dem Format folgen:

    Subject: <neutral subject line>

    Message:
    <plain text body>

  - Kein Markdown-Codefence um Subject oder Message.
  - Die Nachricht als Plain Text ausgeben.
  - Der Betreff darf nur in der Subject-Zeile stehen und nicht im Message-Body wiederholt werden.
  - Der Message-Body beginnt direkt nach `Message:` mit der Begrüßung.
  - Auf LinkedIn mit Vornamen grüßen, z. B. "Hallo Susann," statt Herr/Frau.
  - Wenn die Person zuerst vernetzt hat, persönlicher beginnen.

  Lead:
  Name:
  Firma:
  Rolle:
  Website:
  LinkedIn-Kontext:
  Branche:
  Auffälligkeiten / Verbesserungen:
  Ton: eher locker / eher formell
  Ansprache: Sie / du / selbst entscheiden
  Website vorhanden: ja / nein
  Person hat zuerst vernetzt: ja / nein
