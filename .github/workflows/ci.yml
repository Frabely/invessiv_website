name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build:web

      - name: Build workspace
        run: pnpm build:workspace

  contact-e2e:
    if: ${{ secrets.CONTACT_E2E_DATABASE_URL != '' && secrets.CONTACT_E2E_RESEND_API_KEY != '' && secrets.CONTACT_E2E_MAIL_FROM != '' && secrets.CONTACT_E2E_MAIL_TO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @invessiv/web exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm build:web
        env:
          DATABASE_URL: ${{ secrets.CONTACT_E2E_DATABASE_URL }}
          CONTACT_MAIL_PROVIDER: resend
          CONTACT_MAIL_FROM: ${{ secrets.CONTACT_E2E_MAIL_FROM }}
          CONTACT_MAIL_TO: ${{ secrets.CONTACT_E2E_MAIL_TO }}
          RESEND_API_KEY: ${{ secrets.CONTACT_E2E_RESEND_API_KEY }}

      - name: Contact lead E2E
        run: pnpm --filter @invessiv/web exec playwright test contact-lead-persistence
        env:
          DATABASE_URL: ${{ secrets.CONTACT_E2E_DATABASE_URL }}
          CONTACT_MAIL_PROVIDER: resend
          CONTACT_MAIL_FROM: ${{ secrets.CONTACT_E2E_MAIL_FROM }}
          CONTACT_MAIL_TO: ${{ secrets.CONTACT_E2E_MAIL_TO }}
          RESEND_API_KEY: ${{ secrets.CONTACT_E2E_RESEND_API_KEY }}
