<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Particle Drift Mockup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="scene">
      <img
        src="../../../logo_mockups/logo_no_text.png"
        alt="Logo"
        class="logo"
      />
      <p class="eyebrow">Canvas Particle Drift</p>
      <h1>Pseudo-3D background particles for premium hero atmosphere.</h1>

      <section class="canvas-wrap">
        <canvas id="bg3d" aria-label="Particle background"></canvas>
        <div class="overlay">
          <h2>Pointer drift + depth layers</h2>
          <p>
            Use this for hero ambience. Keep reduced motion and mobile budgets
            in mind.
          </p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
