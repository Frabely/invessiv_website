<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Infinite Card Rondell (3 sichtbar)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="mock">
  <div class="header">
    <h1>Infinite Cards (Mockup)</h1>
    <div class="hint">Swipe / Drag horizontal</div>
  </div>

  <div class="viewport">
    <div class="fade left"></div>
    <div class="fade right"></div>

    <div class="track" id="track" aria-label="Unendlicher Karten-Track">
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
      <div class="card">
        <h2 class="title">Card</h2>
        <div class="ph w70"></div>
        <div class="ph w90"></div>
        <div class="ph w80"></div>
        <button class="btn" type="button">Action</button>
      </div>
    </div>
  </div>
</div>

<script src="./script.js"></script>
</body>
</html>
